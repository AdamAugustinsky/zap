[package]
name = "zfcalls"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Zap's call media behind a C ABI, for the Go backend: whatsapp-rust's VoIP engine without its client"
publish = false

[lib]
name = "zfcalls"
# cdylib: libzfcalls.dylib, loaded by gnui/gocore/calls with purego. rlib:
# the tests link the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Upstream's core without its egui client, for the call's audio
# (call_audio.rs), camera, H.264 encoder and decoder (calls.rs'
# VideoPipeline) and frames (video_frames.rs). Only what the C entry points
# reach is linked. Build with `-p zfcalls`: a workspace-wide build also
# builds upstream's default `ui`, and Cargo unifies the two.
zapfast = { path = "..", default-features = false, features = ["headless"] }
# The media engine (wacore's sans-IO CallEngine and run_call) and the native
# relay transport (RelayMediaChannelFactory), at upstream's pin. No Client is
# ever built: whatsmeow owns the socket and Signal, and hands over the call's
# plaintext key and relay.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "5e72baf000aa4fb65ed89d1c955a54029a7f29a6", default-features = false, features = ["tokio-runtime", "tokio-native", "voip"] }
# All already in Cargo.lock through upstream, at these versions.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-channel = "2.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
