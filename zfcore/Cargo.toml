[package]
name = "zapfast_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "ZapFast's core behind a C ABI, for the Go UI"
publish = false

[lib]
name = "zapfast_core"
# cdylib: libzapfast_core.dylib for the Go UI. rlib: the unit tests and the
# fixture writer link the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Upstream's core without its egui client. Build this crate with
# `-p zapfast_core`: a workspace-wide build also builds upstream's default
# `ui`, and Cargo unifies the two.
zapfast = { path = "..", default-features = false, features = ["headless"] }
# The wake pipe and its non-blocking flags. Already in Cargo.lock.
libc = "0.2"
# Already in Cargo.lock through upstream.
log = "0.4"
# Display text cut over its bound is cut at a grapheme boundary (already in
# Cargo.lock through upstream).
unicode-segmentation = "1"

[features]
# Checks the DTO matches against upstream's egui configuration (its updater
# variants): `cargo check -p zapfast_core --features ui`. Never shipped: it
# links egui.
ui = ["zapfast/ui"]

[dev-dependencies]
tempfile = "3"
# An in-memory keyring for the archive key in tests. Already in Cargo.lock.
keyring-core = "1"
# A second connection to a test archive, holding its writer lock. Upstream's
# SQLCipher build; already in Cargo.lock.
rusqlite = "0.40"
